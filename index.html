<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Dividido</title>
    <link rel="stylesheet" href="css/estilos.css">
    
        
</head>
<body>

    <div class="main-contenedor">
        
        <div class="lado_izquierdo">
            <div class="form-box">
                <div class="foto_de_talentotech">
                    <img src="img/talentoTech.svg
                    " alt="Avatar">
                </div>

                <div class="titulo">Bienvenido de nuevo</div>

                <div class="input-group">
                    <div class="input-label">Correo Electrónico</div>
                    <input type="email" class="input-field" placeholder="tu@email.com">
                </div>

                <div class="input-group">
                    <div class="input-label">Contraseña</div>
                    <input type="password" class="input-field" placeholder="********">
                </div>

                <div class="boton_ingresar">Ingresar</div>
            </div>
        </div>

        <div class="lado_derecho">
            </div>

    </div>

</body>
</html>
